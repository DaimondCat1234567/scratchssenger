<html>
  <head>
    <title>Scratchssenger Desktop</title>
    <style>
      body {
        text-align: center
      }
    </style>
  </head>
  <body>
    <script>
      const Install = (url, file) => {
        const link = document.createElement("a");
        link.href = url
        link.download = file
        document.body.appendChild(link)
        link.click()
        link.remove()
      }
    </script>
    <h1>Scratchssenger Desktop</h1>
    <h2>1.4.4</h2>
    <h3>Windows 10+</h3>
    <button onclick="Install('/desktop/desktop-1-4-4-x64.exe')">Install 64-bit</button>
    <button onclick="Install('/desktop/desktop-1-4-4-ia-32.exe')">Install 32-bit</button>
    <button onclick="Install('/desktop/desktop-1-4-4-ARM64.exe')">Install ARM 64-bit</button>
    <button onclick="Install('/desktop/desktop-1-4-4.x64.exe')">Install portable (64-bit)</button>
    <h3>Linux</h3>
    <button onclick="Install('/desktop/desktop-1-4-4-adm64.deb')">Install on Debian/Ubuntu/Mint x86 64-bit</button>
    <button onclick="Install('/desktop/desktop-1-4-4-arm64.deb')">Install on Debian/Ubuntu/Mint ARM 64-bit</button>
    <h3>MacOS 12+</h3>
    <button onclick="Install('/desktop/desktop-1-4-4.dmg')">Install</button>
    <h3>sosirsOS</h3>
    <button onclick="Install('/desktop/sosirsOS/1.4.4-HTML.html', 'sosirsOS-1.4.4-release.html')">Install HTML (sosirsOS 1.2.0 DEMO 6.1+)</button>
  </body>
</html>
